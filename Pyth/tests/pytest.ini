[tool:pytest]
# Configuration pytest pour le projet JTrading

# Répertoires de tests
testpaths = tests

# Patterns de fichiers de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Options par défaut
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Marqueurs personnalisés
markers =
    slow: marque les tests lents
    integration: marque les tests d'intégration
    unit: marque les tests unitaires
    indicators: marque les tests d'indicateurs
    strategies: marque les tests de stratégies
    backtesting: marque les tests de backtesting
    data: marque les tests de données
    config: marque les tests de configuration

# Filtres d'avertissements
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:pandas.*
    ignore::UserWarning:matplotlib.*

# Timeout pour les tests
timeout = 300

# Minimum version de Python
minversion = 3.8
